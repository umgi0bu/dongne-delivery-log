<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14283b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>동네 배달 일지</title>
  <style>
    :root {
      --ink:#3b291d; --muted:#735b43; --paper:#d8c596; --card:#f3dfa9;
      --teal:#50ad70; --teal-soft:#bddd9e; --orange:#c8763d; --gold:#e3b64f;
      --red:#a6473f; --line:#7b4f30; --road:#70808a; --shadow:6px 7px 0 rgba(63,37,22,.55);
    }
    * { box-sizing:border-box; }
    html,body { height:100%; overflow:hidden; }
    body { margin:0; min-height:100svh; color:var(--ink); font-family:"DungGeunMo","Galmuri11","Malgun Gothic",monospace; background:#26352f; overscroll-behavior:none; }
    button { font:inherit; }
    .shell { display:grid; place-items:center; width:100%; height:100svh; margin:auto; padding:16px; }
    .app { display:flex; flex-direction:column; width:min(430px,calc(46.15svh - 15px),calc(100vw - 24px)); max-height:calc(100svh - 32px); aspect-ratio:9/19.5; overflow:hidden; background:rgba(255,253,247,.94); border:1px solid rgba(255,255,255,.9); border-radius:28px; box-shadow:var(--shadow); }
    .topbar { display:none; }
    .topline { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .eyebrow { display:none; }
    h1 { margin:0; font-size:27px; letter-spacing:-.04em; }
    .weather { padding:5px 8px; border-radius:9px; background:rgba(255,255,255,.13); font-size:15px; font-weight:800; white-space:nowrap; }
    .dayline { display:flex; align-items:center; justify-content:flex-start; gap:6px; margin-top:3px; color:#d8ede9; font-size:13.5px; }
    .dayline > span:last-child::before { content:"· "; }
    .daytrack { display:none; }
    .daydot { height:5px; border-radius:99px; background:rgba(255,255,255,.18); }
    .daydot.done { background:#f6c153; }
    .daydot.current { background:white; }
    .stats { display:none; }
    .gamebar { flex:0 0 auto; display:grid; grid-template-columns:1fr 92px; min-height:54px; color:white; background:#14283b; }
    .game-summary { display:flex; align-items:center; gap:8px; padding:8px 11px; border-right:1px solid rgba(255,255,255,.14); }
    .game-summary span,.game-summary strong { padding:7px 9px; border-radius:10px; background:rgba(255,255,255,.1); font-size:18px; white-space:nowrap; }
    .game-summary strong { overflow:hidden; text-overflow:ellipsis; }
    .home-button { margin:7px; border:0; border-radius:11px; color:#14283b; background:#f4c45b; font-size:18px; font-weight:900; cursor:pointer; }
    .home-button:disabled { opacity:.45; cursor:not-allowed; }
    .stat { min-width:0; padding:6px 4px; text-align:center; background:var(--card); }
    .stat span { display:block; margin-bottom:1px; color:var(--muted); font-size:12px; }
    .stat strong { display:block; overflow:hidden; color:var(--ink); font-size:18px; letter-spacing:-.04em; text-overflow:ellipsis; white-space:nowrap; }
    .map-wrap { position:relative; flex:1 1 auto; min-height:0; margin:0; overflow:hidden; border-radius:0; background:#d7e5df; }
    .map { position:relative; width:100%; height:100%; min-height:270px; overflow:hidden; }
    .map::before { content:""; position:absolute; inset:0; opacity:.32; background:linear-gradient(90deg,transparent 49%,rgba(255,255,255,.9) 50%,transparent 51%),linear-gradient(transparent 49%,rgba(255,255,255,.75) 50%,transparent 51%); background-size:54px 54px; }
    .map-hud { position:absolute; left:10px; right:10px; top:10px; z-index:11; display:flex; justify-content:space-between; pointer-events:none; }
    .map-hud span { padding:7px 10px; border-radius:11px; color:white; background:rgba(20,40,59,.88); box-shadow:0 5px 14px rgba(20,40,59,.18); font-size:18px; font-weight:900; backdrop-filter:blur(7px); }
    .map.delivering .map-hud { opacity:0; }
    .roads { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    .road { stroke:#8c999e; stroke-width:5; stroke-linecap:round; }
    .road.active { stroke:#f1a33a; stroke-width:7; }
    .map.delivering .road.active { stroke-dasharray:8 6; animation:road-flow .9s linear infinite; }
    .node { position:absolute; z-index:2; width:62px; height:62px; padding:0; transform:translate(-50%,-50%); border:0; border-radius:18px; color:#38515a; background:transparent; cursor:pointer; }
    .node .icon { display:block; width:100%; height:100%; font-size:28.5px; }
    .node .icon img { display:block; width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 5px 4px rgba(32,54,59,.24)); image-rendering:pixelated; }
    .node.hub-node { width:42px; height:42px; border:5px solid #fffdf8; border-radius:50%; background:var(--teal); box-shadow:0 5px 12px rgba(24,38,52,.25),inset 0 0 0 4px rgba(255,255,255,.2); }
    .node.hub-node .hub-dot { position:absolute; inset:10px; border-radius:50%; background:#f4c45b; }
    .node .name { position:absolute; left:50%; top:61px; transform:translateX(-50%); width:max-content; max-width:82px; color:#334c54; font-size:13.5px; font-weight:900; text-shadow:0 1px 3px #fff,0 0 4px #fff; }
    .node.hub-node .name { top:45px; }
    .node.bottom-node .name { top:auto; bottom:61px; }
    .node.pickup { box-shadow:0 0 0 4px #4cbca6,0 5px 13px rgba(32,54,59,.16); }
    .node.dropoff { box-shadow:0 0 0 4px #f0a33c,0 5px 13px rgba(32,54,59,.16); }
    .node.selected-home { box-shadow:0 0 0 4px #f0a33c,0 5px 13px rgba(32,54,59,.16); }
    .node.visited { animation:node-arrival .7s ease; }
    .order-badge { position:absolute; right:-5px; top:-6px; display:grid; place-items:center; min-width:20px; height:20px; padding:0 5px; border-radius:99px; color:white; background:var(--teal); box-shadow:0 2px 6px rgba(24,38,52,.2); font-size:13.5px; font-weight:900; }
    .stop-number { position:absolute; left:-6px; top:-7px; display:grid; place-items:center; width:22px; height:22px; border-radius:50%; color:white; background:var(--orange); box-shadow:0 2px 6px rgba(24,38,52,.2); font-size:15px; font-weight:900; }
    .player-marker { position:absolute; z-index:4; width:43px; height:64px; transform:translate(-50%,-72%); transition:left .48s cubic-bezier(.2,.75,.25,1),top .48s cubic-bezier(.2,.75,.25,1); pointer-events:none; }
    .player-marker img { width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 5px 4px rgba(24,38,52,.3)); transform-origin:50% 88%; }
    .player-marker.west img { transform:scaleX(-1); }
    .player-marker.idle img { position:relative; animation:courier-idle 1.6s steps(1,end) infinite; }
    .player-marker.delivering img { animation:courier-step .34s ease-in-out infinite alternate; }
    .player-marker.delivering { z-index:8; width:50px; height:75px; }
    .cargo { position:absolute; right:-17px; top:2px; display:grid; place-items:center; width:29px; height:29px; border-radius:10px; background:white; box-shadow:0 4px 12px rgba(24,38,52,.25); font-size:24px; opacity:0; transform:scale(.65); transition:.2s ease; }
    .player-marker.carrying .cargo { opacity:1; transform:scale(1); }
    .player-marker.handoff .cargo { color:white; background:var(--teal); animation:handoff-pop .5s ease; }
    .motion-mark { position:absolute; left:-10px; bottom:5px; color:white; font-size:21px; font-weight:900; opacity:0; text-shadow:0 2px 4px rgba(24,38,52,.55); }
    .player-marker.delivering .motion-mark { opacity:1; animation:motion-fade .55s ease infinite; }
    .idle-mark { position:absolute; right:-8px; top:1px; color:#fff3c9; font-size:24px; font-weight:900; line-height:1; opacity:0; text-shadow:2px 2px #4d301f; }
    .player-marker.idle .idle-mark { animation:courier-think 3.2s steps(1,end) infinite; }
    .map-legend { position:absolute; right:8px; bottom:8px; z-index:5; padding:6px 8px; border-radius:9px; color:#52636a; background:rgba(255,253,247,.88); font-size:12px; font-weight:800; }
    .map.delivering .map-legend { opacity:0; }
    .delivery-stage { position:absolute; left:50%; top:8px; z-index:10; display:none; width:min(290px,calc(100% - 16px)); transform:translateX(-50%); padding:9px 11px; border-radius:13px; color:white; background:rgba(20,40,59,.9); box-shadow:0 8px 24px rgba(20,40,59,.22); backdrop-filter:blur(8px); text-align:center; }
    .map.delivering .delivery-stage { display:block; }
    .stage-track { display:flex; align-items:center; justify-content:center; gap:5px; margin-bottom:5px; }
    .stage-track span { color:#93aaa9; font-size:12px; font-weight:900; }
    .stage-track span.active { color:#fff; }
    .stage-track span.done { color:#f4c45b; }
    .stage-track i { width:15px; height:2px; background:#526872; }
    .stage-track i.done { background:#f4c45b; }
    .delivery-stage b { display:block; font-size:18px; }
    .delivery-stage small { display:block; margin-top:2px; color:#cfe0de; font-size:13.5px; }
    @keyframes road-flow { to { stroke-dashoffset:-14; } }
    @keyframes courier-step { from { transform:translateY(0) rotate(-1.5deg); } to { transform:translateY(-4px) rotate(1.5deg); } }
    @keyframes courier-idle { 0%,44%,100% { top:0; } 45%,78% { top:-2px; } 79%,88% { top:0; } 89%,94% { top:-1px; } }
    @keyframes courier-think { 0%,69%,100% { opacity:0; } 70%,84% { opacity:1; } 85%,99% { opacity:0; } }
    @keyframes motion-fade { 0% { transform:translateX(6px); opacity:0; } 40% { opacity:1; } 100% { transform:translateX(-5px); opacity:0; } }
    @keyframes handoff-pop { 0% { transform:scale(.5); } 65% { transform:scale(1.25); } 100% { transform:scale(1); } }
    @keyframes node-arrival { 0% { transform:translate(-50%,-50%) scale(1); } 50% { transform:translate(-50%,-50%) scale(1.22); } 100% { transform:translate(-50%,-50%) scale(1); } }
    .status { display:none; }
    .status i { flex:0 0 8px; width:8px; height:8px; border-radius:50%; background:var(--teal); }
    .tabs { display:none; }
    .tab { border:0; border-radius:8px; padding:6px; color:var(--muted); background:transparent; font-size:15px; font-weight:850; cursor:pointer; }
    .tab.active { color:var(--ink); background:white; box-shadow:0 2px 8px rgba(28,42,48,.09); }
    .panel { flex:0 0 auto; min-height:0; overflow:visible; padding:10px 10px calc(10px + env(safe-area-inset-bottom)); background:var(--card); }
    .panel-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:9px; }
    .panel-head h2 { margin:0; font-size:24px; letter-spacing:-.04em; }
    .panel-head span { color:var(--muted); font-size:13.5px; }
    .orders { display:grid; gap:8px; }
    .planner-empty { padding:20px 14px; border:1px dashed #bdc8c3; border-radius:16px; color:var(--muted); background:#f5f6f1; text-align:center; font-size:16.5px; line-height:1.55; }
    .route-stops { display:grid; gap:7px; }
    .route-stop { display:grid; grid-template-columns:32px 1fr auto; gap:9px; align-items:center; padding:10px; border-radius:14px; background:white; box-shadow:inset 0 0 0 1px var(--line); }
    .route-index { display:grid; place-items:center; width:30px; height:30px; border-radius:10px; color:white; background:var(--orange); font-size:18px; font-weight:900; }
    .route-stop b { display:block; font-size:16.5px; }
    .route-stop span { color:var(--muted); font-size:12px; }
    .route-actions { display:grid; grid-template-columns:repeat(2,27px); gap:3px; }
    .route-actions button { width:27px; height:27px; border:0; border-radius:8px; color:#496068; background:#e9efec; font-size:16.5px; font-weight:900; cursor:pointer; }
    .route-actions button:disabled { opacity:.3; cursor:default; }
    .order { width:100%; display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:11px; border:1px solid var(--line); border-radius:15px; color:var(--ink); background:white; text-align:left; cursor:pointer; }
    .order.selected { border-color:var(--teal); box-shadow:0 0 0 2px rgba(8,127,112,.16); background:#f7fffc; }
    .order-icon { display:grid; place-items:center; width:39px; height:39px; border-radius:12px; background:#f4eee0; font-size:31.5px; }
    .food-icon { display:block; width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
    .order b { display:block; margin-bottom:4px; font-size:18px; }
    .route { display:block; color:var(--muted); font-size:13.5px; }
    .order-cost { display:block; margin-top:4px; color:#526870; font-size:13.5px; font-weight:800; }
    .order.unavailable { background:#f7f3f1; }
    .order.unavailable .order-cost { color:var(--red); }
    .order-pay { text-align:right; }
    .order-pay strong { display:block; color:var(--teal); font-size:18px; }
    .order-pay small { color:var(--red); font-size:12px; }
    .actionbox { margin:0; padding:0; background:transparent; }
    .estimate { display:flex; justify-content:space-between; gap:8px; margin-bottom:9px; color:#4a5e65; font-size:13.5px; }
    .energy-effect { display:flex; justify-content:space-between; align-items:center; margin:0 0 9px; padding:8px 9px; border-radius:10px; color:#076d62; background:#dff6ef; box-shadow:inset 0 0 0 1px rgba(8,127,112,.16); font-size:13.5px; font-weight:850; }
    .energy-effect strong { color:var(--teal); }
    .energy-effect.weather-effect { color:#7b5415; background:#fff0cc; box-shadow:inset 0 0 0 1px rgba(194,127,23,.18); }
    .energy-effect.weather-effect strong { color:#a9680b; }
    .requirements { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:9px; }
    .requirement { padding:9px; border-radius:11px; background:white; box-shadow:inset 0 0 0 1px #d8e4df; }
    .requirement span { display:block; margin-bottom:3px; color:var(--muted); font-size:12px; }
    .requirement strong { display:block; color:var(--teal); font-size:16.5px; }
    .requirement.bad { background:#fff1f1; box-shadow:inset 0 0 0 1px #e9b8bb; }
    .requirement.bad strong { color:var(--red); }
    .requirement.deadline { grid-column:1/-1; }
    .shortage { margin:0 0 9px; color:var(--red); font-size:13.5px; font-weight:850; line-height:1.4; }
    .selected-items { display:flex; gap:7px; margin:0 0 8px; padding:1px 0 2px; overflow-x:auto; scrollbar-width:none; }
    .selected-items::-webkit-scrollbar { display:none; }
    .selected-item { flex:0 0 auto; min-width:145px; display:grid; grid-template-columns:34px 1fr; gap:8px; align-items:center; padding:7px 9px; border:1px solid #cbd8d2; border-radius:12px; color:var(--ink); background:#fffdf8; text-align:left; cursor:pointer; }
    .selected-item i { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:#f4eee0; font-style:normal; font-size:28.5px; }
    .selected-item b { display:block; max-width:120px; overflow:hidden; font-size:15px; text-overflow:ellipsis; white-space:nowrap; }
    .selected-item span { display:block; margin-top:2px; color:var(--teal); font-size:12px; font-weight:800; }
    .selected-item:disabled { opacity:.6; cursor:default; }
    .cta { width:100%; min-height:47px; border:0; border-radius:13px; color:white; background:var(--teal); font-weight:900; cursor:pointer; }
    .cta:disabled { color:#8b9699; background:#d6dcda; cursor:not-allowed; }
    .end-btn { width:100%; margin-top:8px; border:1px solid var(--line); border-radius:12px; padding:10px; color:#64727a; background:transparent; font-size:15px; font-weight:800; cursor:pointer; }
    .gear-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .gear { min-height:95px; padding:12px; border-radius:15px; background:#f2f0e9; }
    .gear.locked { opacity:.48; filter:grayscale(1); }
    .gear i { font-style:normal; font-size:33px; }
    .gear b { display:block; margin:6px 0 3px; font-size:16.5px; }
    .gear span { color:var(--muted); font-size:13.5px; line-height:1.35; }
    .goalbox { padding:14px; border-radius:17px; color:white; background:linear-gradient(135deg,#1a3a4b,#0e766b); }
    .goalrow { display:flex; justify-content:space-between; gap:10px; font-size:16.5px; }
    .goalrow strong { font-size:25.5px; }
    .progress { height:9px; margin-top:10px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.18); }
    .progress i { display:block; height:100%; border-radius:inherit; background:#f4c45b; }
    .log { display:grid; gap:6px; margin-top:10px; }
    .log p { margin:0; padding:8px 9px; border-radius:10px; color:#53646a; background:#f3f1eb; font-size:13.5px; }
    .reset { margin-top:10px; border:0; color:#a44c51; background:transparent; font-size:13.5px; text-decoration:underline; cursor:pointer; }
    .disclaimer { display:none; }
    .tap-hint { display:block; margin-top:5px; color:var(--teal); font-size:12px; font-weight:900; }
    .quick-backdrop { position:fixed; inset:0; z-index:15; display:none; place-items:end center; padding:14px 10px calc(14px + env(safe-area-inset-bottom)); background:rgba(10,22,30,.3); backdrop-filter:blur(2px); }
    .quick-backdrop.show { display:grid; }
    .quick-sheet { width:min(500px,100%); padding:16px; border-radius:22px; background:#fffdf7; box-shadow:0 18px 55px rgba(15,29,38,.3); animation:quick-rise .22s ease-out; }
    .quick-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
    .quick-title { display:flex; gap:10px; align-items:center; }
    .quick-title i { display:grid; place-items:center; width:42px; height:42px; border-radius:13px; background:#f4eee0; font-style:normal; font-size:34.5px; }
    .quick-title b { display:block; font-size:21px; }
    .quick-title span { color:var(--muted); font-size:13.5px; }
    .quick-close { width:34px; height:34px; border:0; border-radius:11px; color:#66757a; background:#eeece5; font-size:27px; cursor:pointer; }
    .quick-facts { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:12px 0; }
    .quick-fact { padding:9px 5px; border-radius:11px; background:#f0f4f1; text-align:center; }
    .quick-fact span { display:block; color:var(--muted); font-size:12px; }
    .quick-fact strong { display:block; margin-top:3px; font-size:16.5px; }
    .quick-warning { margin:0 0 9px; color:var(--red); font-size:13.5px; font-weight:850; text-align:center; }
    .house-orders { display:grid; gap:7px; margin:12px 0; }
    .house-order { width:100%; display:grid; grid-template-columns:24px minmax(0,1fr) auto auto auto; gap:6px; align-items:center; padding:10px; border:1px solid var(--line); border-radius:13px; color:var(--ink); background:white; text-align:left; }
    .house-order.selected { border-color:var(--teal); background:#edfaf6; box-shadow:0 0 0 2px rgba(8,127,112,.12); }
    .house-order i { font-style:normal; font-size:31.5px; }
    .house-order > i { display:grid; place-items:center; width:24px; height:24px; }
    .house-order > span { min-width:0; }
    .house-order b { display:block; font-size:15px; }
    .house-order span { color:var(--muted); font-size:12px; }
    .house-order strong { color:var(--teal); font-size:15px; white-space:nowrap; }
    .order-heart { color:var(--red); font-size:15px; font-style:normal; font-weight:900; white-space:nowrap; }
    .order-price { color:var(--teal); font-size:15px; font-style:normal; font-weight:900; white-space:nowrap; }
    .order-select { min-width:62px; min-height:30px; border:0; border-radius:8px; color:white; background:var(--teal); font-size:15px; font-weight:900; cursor:pointer; }
    .house-order.selected .order-select { color:#144332; background:#b8dc87; }
    .quick-accept { width:100%; min-height:52px; border:0; border-radius:14px; color:white; background:var(--teal); font-weight:900; cursor:pointer; }
    .quick-accept:disabled { color:#8b9699; background:#d6dcda; cursor:not-allowed; }
    .modal-backdrop { position:fixed; inset:0; z-index:20; display:none; place-items:end center; padding:18px 12px calc(18px + env(safe-area-inset-bottom)); background:rgba(10,22,30,.58); backdrop-filter:blur(5px); }
    .modal-backdrop.show { display:grid; }
    .modal { width:min(480px,100%); max-height:86vh; overflow:auto; padding:20px; border-radius:24px; background:#fffdf7; box-shadow:var(--shadow); }
    .modal-kicker { margin:0 0 6px; color:var(--teal); font-size:15px; font-weight:900; letter-spacing:.08em; }
    .modal h2 { margin:0; font-size:33px; letter-spacing:-.05em; }
    .modal-copy { margin:10px 0 16px; color:#5e6d73; font-size:18px; line-height:1.6; white-space:pre-line; }
    .home-screen-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .home-screen-head h2 { margin:0; }
    .home-screen h3 { margin:15px 0 7px; font-size:19.5px; }
    .home-screen .gear-grid { grid-template-columns:repeat(2,1fr); }
    .home-screen .gear { min-height:82px; padding:10px; }
    .home-resume { width:100%; min-height:48px; margin-top:14px; border:0; border-radius:14px; color:white; background:var(--teal); font-weight:900; cursor:pointer; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; padding:13px; border:1px solid var(--line); border-radius:15px; color:var(--ink); background:white; text-align:left; cursor:pointer; }
    .choice.primary { color:white; border-color:var(--teal); background:var(--teal); }
    .choice b { display:block; margin-bottom:3px; font-size:18px; }
    .choice span { color:inherit; opacity:.72; font-size:13.5px; line-height:1.4; }
    .ending { text-align:center; }
    .ending-icon { font-size:72px; }
    /* Cohesive pixel-game UI theme */

    function endCampaign(){
      state.ended=true;saveGame();const avg=Math.round(state.totalNet/7),great=state.totalNet>=700000&&state.rep>=7,good=state.totalNet>=560000,title=great?'동네의 전설':good?'우리 동네 해결사':'다시 출발하는 라이더',icon=great?'🏆':good?'🌟':'🚲';
      showModal('캠페인 완주',`${icon} ${title}`,`7일 총 순수익 ${money(state.totalNet)}\n하루 평균 ${money(avg)}\n완료한 주문 ${state.totalCompleted}건 · 최종 평판 ${state.rep}\n\n같은 동네라도 날씨와 주문, 사건이 달라지면 전혀 다른 운영이 필요합니다.`,[{label:'새 캠페인 시작',detail:'기록을 초기화하고 다시 도전합니다.',run:startNewCampaign}],true)
    }
    function startNewCampaign(){state=freshState();state.weather=choose(WEATHER).id;selectedOrders=[];routeStops=[];activeRoute=[];isDelivering=false;refreshOrders();hideModal();activeTab='orders';setStatus('가정을 눌러 주문을 고르고 첫 배달 경로를 만드세요.');render()}
    function confirmReset(){showModal('기록 초기화','새 캠페인을 시작할까요?','현재 7일 캠페인의 수익과 장비 기록이 사라집니다.',[{label:'초기화하고 다시 시작',detail:'현재 기록을 지웁니다.',run:startNewCampaign},{label:'취소',detail:'현재 캠페인을 유지합니다.',run:hideModal}])}
    function showIntro(hasSave){
      if(hasSave&&!state.ended){showModal('이어하기',`${state.day}일차 배달 일지`,`현재 순수익 ${money(state.cash)} · 장비 ${state.perks.length}개\n진행 중인 캠페인을 이어서 플레이합니다.`,[{label:'계속 플레이',detail:'저장된 위치에서 시작합니다.',run:hideModal},{label:'새 캠페인',detail:'현재 기록을 지우고 처음부터 시작합니다.',run:confirmReset}]);return}
      showModal('프리미엄 모바일 게임 콘셉트','7일 동안 동네에서 살아남기','각 가정에 들어온 다양한 주문을 골라 한 번에 묶고, 방문 순서를 직접 정해 순수익 10만 원을 노리세요.\n\n멀리 갈수록 체력을 많이 쓰므로, 보유 체력 안에서 가장 수익성 좋은 경로를 만드는 것이 핵심입니다. 하루가 끝나면 장비 하나를 골라 다음 날의 전략을 바꿀 수 있습니다.',[{label:'7일 캠페인 시작',detail:'가정 선택 → 주문 선택 → 체력 경로 편집으로 진행합니다.',run:startNewCampaign}],true)
    }
    el.quickBackdrop.addEventListener('click',event=>{if(event.target===el.quickBackdrop)hideQuickAccept()});document.addEventListener('keydown',event=>{if(event.key==='Escape')hideQuickAccept()});
    $('homeButton').addEventListener('click',showHomeScreen);
    document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(isDelivering)return;hideQuickAccept();activeTab=b.dataset.tab;renderPanel()}));
    const loaded=loadGame();state=loaded||freshState();if(!state.orders)state.orders=[];if(state.location!=='hub'){state.location='hub';addLog('다음 배달 준비를 위해 배달상점으로 복귀했다.')}refreshOrders();render();showIntro(Boolean(loaded));
  })();
  </script>
</body>
</html>
